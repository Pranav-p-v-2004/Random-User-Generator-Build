<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container my-5">

    <h1 class="text-primary text-center">Random User Generator</h1>

    <div class="text-center my-4">
        <input type="number" id="userCount" placeholder="Enter number of users" class="form-control w-25 mx-auto" value="1">

        <button class="btn btn-success mt-3" onclick="fetchUsersData()">
            Generate Users
        </button>
    </div>

    <div id="result" class="row">

    </div>

</div>

</body>

<script>

    async function fetchUsersData() {

        try {

            result.innerHTML = ""
            const totalUsers = userCount.value || 1
            const response = await fetch(`https://randomuser.me/api/?results=${totalUsers}`)
            console.log(response);
            const AllUsers = await response.json()
            console.log(AllUsers);
            AllUsers.results.forEach(user => {
                result.innerHTML += `
                <div class="col-lg-4">
                    <div class="card my-5 text-center shadow">
                        <img style="width:150px; height:150px; border-radius:50%;" 
                        src="${user.picture.large}" class="mx-auto mt-3">

                        <div class="card-body">
                            <h5 class="card-title">${user.name.first} ${user.name.last}</h5>
                            <p class="card-text">Email: ${user.email}</p>
                            <p class="card-text"> Location: ${user.location.city}, ${user.location.country}</p>
                            <p class="card-text">Phone: ${user.phone} </p>
                                
                        </div>
                    </div>
                </div>

                `

            })

        }

        catch (error) {

            console.log(error);

        }

    }

</script>

</html>
